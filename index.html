<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アウター出品台帳</title>
<style>
  :root{
    --canvas:#E4E1D4;
    --canvas-deep:#D9D5C4;
    --ink:#26312B;
    --ink-soft:#5D6660;
    --ink-faint:#8B8F84;
    --card:#FBFAF5;
    --line:#C7C2AC;
    --brass:#AD7E33;
    --brass-deep:#7C5A22;
    --brass-tint:#F1E2C4;
    --olive:#57724F;
    --olive-deep:#3A4E34;
    --olive-tint:#DEE7D4;
    --slate:#3B5A82;
    --slate-deep:#2A4160;
    --slate-tint:#D9E2ED;
    --red:#A2453F;
    --red-deep:#732F2B;
    --red-tint:#F1DAD5;
    --radius-s:3px;
    --radius-m:8px;
    --shadow-tag:0 1px 0 rgba(38,49,43,0.06), 0 1px 3px rgba(38,49,43,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:920px;margin:0 auto;padding:20px 16px 60px;}
  .app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:50%;background:var(--card);border:1.5px solid var(--brass);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-weight:700;color:var(--brass-deep);font-size:15px;flex-shrink:0;
  }
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:0.01em;}
  .brand p{margin:1px 0 0;font-size:12px;color:var(--ink-soft);}
  .mode-switch{display:flex;background:var(--canvas-deep);border-radius:999px;padding:4px;gap:2px;}
  .mode-switch button{
    border:none;background:transparent;padding:10px 18px;border-radius:999px;
    font-size:14px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;
    transition:background .15s,color .15s;
  }
  .mode-switch button.active{background:var(--ink);color:var(--canvas);}
  .view{display:none;}
  .view.active{display:block;}

  .worker-intro{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:16px 18px;margin-bottom:16px;
  }
  .worker-intro h2{margin:0 0 4px;font-size:17px;}
  .worker-intro p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.6;}

  .stepper-dots{display:flex;justify-content:center;gap:8px;margin:6px 0 18px;flex-wrap:wrap;}
  .stepper-dots span{
    width:30px;height:30px;border-radius:50%;background:var(--canvas-deep);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
    color:var(--ink-faint);border:2px solid transparent;
  }
  .stepper-dots span.done{background:var(--olive-tint);color:var(--olive-deep);}
  .stepper-dots span.current{background:var(--card);border-color:var(--brass);color:var(--brass-deep);}

  .gate-wrap{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:32px 24px;text-align:center;
  }
  .gate-wrap .gate-icon{
    width:56px;height:56px;border-radius:50%;background:var(--brass-tint);color:var(--brass-deep);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;
  }
  .gate-wrap h2{font-size:19px;margin:0 0 6px;}
  .gate-wrap p{font-size:14px;color:var(--ink-soft);margin:0 0 22px;line-height:1.6;}
  .gate-input{
    width:100%;font-size:28px;font-weight:700;text-align:center;letter-spacing:0.04em;
    padding:18px 14px;border:2px solid var(--line);border-radius:var(--radius-s);
    background:#fff;color:var(--ink);font-family:inherit;margin-bottom:14px;
  }
  .gate-input:focus{outline:none;border-color:var(--brass);}
  .no-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--ink);color:var(--canvas);border-radius:var(--radius-s);
    padding:12px 16px;margin-bottom:14px;
  }
  .no-banner .lab{font-size:11.5px;opacity:0.75;letter-spacing:.04em;}
  .no-banner .val{font-size:19px;font-weight:700;font-family:Georgia,serif;}
  .no-banner button{
    border:1px solid rgba(228,225,212,0.4);background:transparent;color:var(--canvas);
    border-radius:999px;padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  }

  .step-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);padding:22px 20px 24px;}
  .step-eyebrow{font-family:Georgia,serif;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--brass-deep);margin:0 0 4px;}
  .step-title{font-size:20px;font-weight:700;margin:0 0 6px;}
  .step-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px;line-height:1.6;}

  .field{margin-bottom:20px;}
  .field label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .field .hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .field input[type=text],.field input[type=url],.field input[type=number],.field textarea{
    width:100%;font-size:17px;padding:14px 14px;border:1.5px solid var(--line);
    border-radius:var(--radius-s);background:#fff;color:var(--ink);font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:90px;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--brass);}

  .chip-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{
    padding:14px 18px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;
    min-height:52px;display:flex;align-items:center;justify-content:center;
  }
  .chip.selected{background:var(--ink);border-color:var(--ink);color:var(--canvas);}
  .chip.wide{padding:14px 22px;}

  .rank-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .rank-chip{
    padding:14px 4px;border-radius:var(--radius-s);border:1.5px solid var(--line);
    background:#fff;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;text-align:center;
  }
  .rank-chip.selected{background:var(--brass);border-color:var(--brass);color:#fff;}

  .measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  @media(max-width:480px){.measure-grid{grid-template-columns:1fr;}}
  .measure-field label{font-size:13.5px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .measure-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
  .measure-field .unit-input{position:relative;}
  .measure-field input{padding-right:38px;}
  .measure-field .unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-soft);font-weight:700;}

  .diagram-wrap{background:var(--canvas);border-radius:var(--radius-m);padding:10px;margin-bottom:18px;display:flex;justify-content:center;}

  .checkbox-row{
    display:flex;align-items:flex-start;gap:12px;background:var(--canvas);border-radius:var(--radius-s);
    padding:14px 16px;cursor:pointer;
  }
  .checkbox-row input{width:22px;height:22px;flex-shrink:0;margin-top:1px;}
  .checkbox-row span{font-size:14.5px;font-weight:700;line-height:1.5;}

  .step-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}
  .btn{border:none;border-radius:999px;font-family:inherit;font-weight:700;cursor:pointer;font-size:16px;padding:15px 26px;min-height:52px;}
  .btn-primary{background:var(--ink);color:var(--canvas);}
  .btn-primary:disabled{background:var(--ink-faint);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-block{width:100%;}
  .btn-small{padding:9px 16px;font-size:13px;min-height:auto;}

  .error-text{
    color:var(--red-deep);font-size:14px;margin-top:10px;font-weight:700;
    background:var(--red-tint);border-radius:var(--radius-s);padding:12px 14px;
    display:flex;align-items:flex-start;gap:8px;line-height:1.5;
  }
  .error-text::before{content:"!";flex-shrink:0;width:20px;height:20px;border-radius:50%;
    background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;}

  .confirm-list{list-style:none;margin:0 0 18px;padding:0;}
  .confirm-list li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
  .confirm-list li span:first-child{color:var(--ink-soft);}
  .confirm-list li span:last-child{font-weight:700;text-align:right;}

  .save-toast{
    background:var(--olive-tint);color:var(--olive-deep);border-radius:var(--radius-m);
    padding:16px 18px;margin-bottom:16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;
  }

  .recent-block{margin-top:26px;}
  .recent-block h3{font-size:14px;color:var(--ink-soft);margin:0 0 10px;font-weight:700;}
  .recent-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;margin-bottom:8px;}
  .recent-tagno{font-family:Georgia,serif;font-weight:700;font-size:13px;color:var(--brass-deep);background:var(--brass-tint);padding:4px 8px;border-radius:3px;flex-shrink:0;}
  .recent-item .rname{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .recent-item .rby{font-size:12px;color:var(--ink-faint);}

  .admin-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .filter-tabs{display:flex;gap:6px;background:var(--canvas-deep);border-radius:999px;padding:4px;flex-wrap:wrap;}
  .filter-tabs button{border:none;background:transparent;padding:9px 14px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .filter-tabs button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow-tag);}
  .search-box{flex:1;min-width:160px;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-family:inherit;background:var(--card);}
  .search-box:focus{outline:none;border-color:var(--brass);}
  .settings-btn{
    border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;
    font-family:inherit;font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }

  .admin-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .tag-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:14px 16px;cursor:pointer;position:relative;}
  .tag-card:hover{border-color:var(--brass);}
  .tag-hole{width:12px;height:12px;border-radius:50%;background:var(--canvas);border:1.5px solid var(--line);flex-shrink:0;}
  .tag-status-bar{width:5px;align-self:stretch;border-radius:3px;flex-shrink:0;}
  .status-new .tag-status-bar{background:var(--ink-faint);}
  .status-checked .tag-status-bar{background:var(--slate);}
  .status-priced .tag-status-bar{background:var(--brass);}
  .status-listed .tag-status-bar{background:var(--olive);}
  .tag-main{flex:1;min-width:0;}
  .tag-main .tno{font-family:Georgia,serif;font-size:12px;color:var(--brass-deep);font-weight:700;}
  .tag-main .tname{font-size:15.5px;font-weight:700;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tag-main .tmeta{font-size:12.5px;color:var(--ink-soft);}
  .tag-price{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .tag-status-pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .status-new .tag-status-pill{background:var(--canvas-deep);color:var(--ink-soft);}
  .status-checked .tag-status-pill{background:var(--slate-tint);color:var(--slate-deep);}
  .status-priced .tag-status-pill{background:var(--brass-tint);color:var(--brass-deep);}
  .status-listed .tag-status-pill{background:var(--olive-tint);color:var(--olive-deep);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state i{font-size:28px;color:var(--ink-faint);}
  .empty-state p{margin:10px 0 0;font-size:14px;}

  .overlay{position:fixed;inset:0;background:rgba(38,49,43,0.45);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;}
  .overlay.open{display:flex;}
  .detail-sheet{background:var(--canvas);border-radius:var(--radius-m);max-width:640px;width:100%;margin-top:10px;padding:0 0 24px;overflow:hidden;}
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 20px;background:var(--card);border-bottom:1px solid var(--line);}
  .detail-head .dno{font-family:Georgia,serif;color:var(--brass-deep);font-size:12px;font-weight:700;}
  .detail-head h2{margin:2px 0 0;font-size:19px;}
  .detail-close{border:none;background:var(--canvas-deep);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink);}
  .detail-body{padding:18px 20px 0;}
  .detail-section{margin-bottom:20px;}
  .detail-section h3{font-size:13px;color:var(--brass-deep);text-transform:uppercase;letter-spacing:.08em;font-family:Georgia,serif;margin:0 0 10px;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
  .kv-grid .kv{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;}
  .kv .k{font-size:11.5px;color:var(--ink-soft);}
  .kv .v{font-size:15px;font-weight:700;margin-top:2px;}
  .staging-link{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;font-size:14px;color:var(--brass-deep);text-decoration:none;font-weight:700;}
  .note-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;font-size:14px;color:var(--ink-soft);line-height:1.6;white-space:pre-wrap;}
  .tag-mini-list{display:flex;flex-wrap:wrap;gap:6px;}
  .tag-mini{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}

  .status-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .status-btn{flex:1;min-width:100px;padding:11px 10px;border-radius:var(--radius-s);border:1.5px solid var(--line);background:#fff;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft);}
  .status-btn.active-new{background:var(--canvas-deep);color:var(--ink-soft);border-color:var(--ink-faint);}
  .status-btn.active-checked{background:var(--slate-tint);color:var(--slate-deep);border-color:var(--slate);}
  .status-btn.active-priced{background:var(--brass-tint);color:var(--brass-deep);border-color:var(--brass);}
  .status-btn.active-listed{background:var(--olive-tint);color:var(--olive-deep);border-color:var(--olive);}

  .platform-tabs{display:flex;gap:6px;margin-bottom:10px;}
  .platform-tabs button{flex:1;padding:10px 6px;border-radius:var(--radius-s);border:1.5px solid var(--line);background:#fff;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft);}
  .platform-tabs button.active{background:var(--ink);color:var(--canvas);border-color:var(--ink);}
  .gen-text{width:100%;min-height:260px;font-size:13.5px;line-height:1.7;padding:14px;border:1.5px solid var(--line);border-radius:var(--radius-s);background:#fff;color:var(--ink);font-family:inherit;resize:vertical;}
  .copy-row{display:flex;justify-content:flex-end;margin-top:8px;}
  .copy-btn{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--canvas);border:none;border-radius:999px;padding:10px 18px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;}
  .copy-btn.copied{background:var(--olive-deep);}

  .loading-row{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:14px;padding:20px 0;}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ---- access code gate (added) ---- */
  #auth-overlay{
    position:fixed;inset:0;background:var(--canvas);z-index:999;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .auth-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:32px 24px;max-width:360px;width:100%;text-align:center;
  }
  .auth-card .auth-icon{
    width:52px;height:52px;border-radius:50%;background:var(--brass-tint);color:var(--brass-deep);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px;font-weight:700;
    font-family:Georgia,serif;
  }
  .auth-card h2{font-size:18px;margin:0 0 6px;}
  .auth-card p{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;line-height:1.6;}
  .auth-input{
    width:100%;font-size:22px;font-weight:700;text-align:center;letter-spacing:0.1em;
    padding:14px;border:2px solid var(--line);border-radius:var(--radius-s);
    background:#fff;color:var(--ink);font-family:inherit;margin-bottom:14px;
  }
  .auth-input:focus{outline:none;border-color:var(--brass);}
  .auth-err{
    color:var(--red-deep);font-size:13.5px;margin-bottom:14px;font-weight:700;
    background:var(--red-tint);border-radius:var(--radius-s);padding:10px 12px;display:none;
  }
  #app-root{display:none;}

  .gate-field-label{font-size:13px;font-weight:700;text-align:left;margin:10px 0 6px;color:var(--ink-soft);}
  .gate-input.gate-worker{font-size:22px;letter-spacing:0;text-align:left;}
  .worker-val{font-family:inherit!important;font-size:16px!important;}
  .measure-grid-large{display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto;}
  .measure-field-large{background:#fff;border:1.5px solid var(--line);padding:10px 12px;border-radius:var(--radius-m);}
  .measure-field-large label{font-size:15px;margin-bottom:5px;}
  .measure-field-large input{font-size:21px!important;font-weight:700;min-height:52px;padding:10px 44px 10px 12px!important;text-align:left;}
  .measure-field-large .unit{font-size:14px;}
  .download-info{background:var(--canvas);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;margin:16px 0;font-size:13.5px;line-height:1.7;color:var(--ink-soft);}
  .download-main-btn{font-size:19px;min-height:66px;margin-top:18px;}
  @media(max-width:480px){.measure-grid-large{max-width:none;}.measure-field-large{padding:9px 10px}.measure-field-large input{font-size:21px!important;min-height:52px;}.no-banner{align-items:center;}.no-banner .val{font-size:16px;}}
</style>
</head>
<body>
<div id="auth-overlay">
  <div class="auth-card">
    <div class="auth-icon">🔒</div>
    <h2>アクセスコードを入力</h2>
    <p>共有データにアクセスするためのコードを入力してください。</p>
    <input type="text" id="auth-input" class="auth-input" placeholder="コード" autocomplete="off" value="01">
    <div id="auth-err" class="auth-err"></div>
    <button class="btn btn-primary btn-block" id="auth-btn">開く</button>
  </div>
</div>
<div id="app-root">
<div class="app">

  <div class="app-header">
    <div class="brand">
      <div class="brand-mark">JK</div>
      <div>
        <h1>アウター出品台帳</h1>
        <p>採寸から出品文の作成まで、価格設定以外を一括で</p>
      </div>
    </div>
    <div class="mode-switch">
      <button id="btn-mode-worker" class="active">作業者用</button>
      <button id="btn-mode-admin">管理用</button>
    </div>
  </div>

  <p class="sr-only">このアプリのデータは、このアプリを使う全員で共有されます。</p>

  <!-- ============ WORKER VIEW ============ -->
  <div class="view active" id="view-worker">
    <div class="worker-intro">
      <h2>新しい商品を登録する</h2>
      <p>商品番号と担当者名から開始し、現場で必要な商品情報だけを入力します。最後にCSVデータをスマホへダウンロードします。</p>
    </div>

const TEST_ACCESS_CODE = '01';
let currentAccessCode = TEST_ACCESS_CODE;
const CATEGORIES = ['ブルゾン','ライダース','コート','ダウンジャケット','マウンテンパーカー','ミリタリージャケット','テーラードジャケット','スタジャン','その他'];

function blankDraft(){
  return {
    gender:'', category:'', size:'', brand:'', color:'', colors:[], customColor:'', managementNo:'', titleOverride:'',
    features:[], design:[],
    measurements:{shoulder:'',chest:'',length:'',sleeve:''},
    rank:'', material:'', materialChoice:'', customMaterial:'', conditionChoice:'', conditionDetail:'', workerName:'',
    shippingSize:'', photoConfirmed:false, stagingUrl:''
  };
}

async function callGAS(action, extraFields){
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 20000); // 20s timeout so the UI never hangs forever
  try{
    const body = Object.assign({ code: currentAccessCode, action }, extraFields || {});
    const httpRes = await fetch(GAS_URL, {
      method: 'POST',
      // text/plain avoids a CORS preflight (OPTIONS) request, which Apps Script web apps do not handle.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if(!httpRes.ok) return { ok:false, error:'network' };
    const data = await httpRes.json();
    return data;
  }catch(e){
    clearTimeout(timeoutId);
    return { ok:false, error:'network' };
  }
}

async function loadItems(){
  const res = await callGAS('list');
  if(res && res.ok && Array.isArray(res.items)){
    items = res.items;
    itemsLoaded = true;
  }
  // on failure, leave itemsLoaded as-is (false) so callers know the load did not succeed
}
async function saveItem(it){
  const res = await callGAS('saveItem', { item: it });
  return !!(res && res.ok);
}
async function loadTemplate(){
  const res = await callGAS('template');
  if(res && res.ok && res.template){
    template = Object.assign({}, DEFAULT_TEMPLATE, res.template);
  }
  templateLoaded = true;
}
async function persistTemplate(){
  const res = await callGAS('saveTemplate', { template: template });
  return !!(res && res.ok);
}

async function onGateStart(){
  const val = document.getElementById('gate-input').value.trim();

  draft = blankDraft();

function csvEscape(v){
  const s=String(v??'').replace(/"/g,'""'); return `"${s}"`;
}
function downloadAllItemsCsv(){
  const headers=['商品番号','担当者','対象','種類','サイズ','ブランド','カラー','特徴','デザイン','肩幅cm','身幅cm','着丈cm','袖丈cm','状態ランク','素材','状態詳細'];
  const rows = items.filter(it=>!it.deleted).map(it=>[
    it.managementNo, it.workerName, it.gender, it.category, it.size, it.brand, it.color,
    (it.features||[]).join('・'), (it.design||[]).join('・'),
    it.measurements ? it.measurements.shoulder : '', it.measurements ? it.measurements.chest : '',
    it.measurements ? it.measurements.length : '', it.measurements ? it.measurements.sleeve : '',
    it.rank, it.material, it.conditionDetail
  ]);
  let csv = '\ufeff' + headers.map(csvEscape).join(',') + '\r\n';
  rows.forEach(row=>{ csv += row.map(csvEscape).join(',') + '\r\n'; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const now = new Date();
  a.download = `商品一覧_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function downloadDraftCsv(){
  const headers=['商品番号','担当者','対象','種類','サイズ','ブランド','カラー','特徴','デザイン','肩幅cm','身幅cm','着丈cm','袖丈cm','状態ランク','素材','状態詳細'];
  const row=[draft.managementNo,draft.workerName,draft.gender,draft.category,draft.size,draft.brand,draft.color,(draft.features||[]).join('・'),(draft.design||[]).join('・'),draft.measurements.shoulder,draft.measurements.chest,draft.measurements.length,draft.measurements.sleeve,draft.rank,draft.material,draft.conditionDetail];
  const csv='\ufeff'+headers.map(csvEscape).join(',')+'\r\n'+row.map(csvEscape).join(',')+'\r\n';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`商品_${draft.managementNo}_${draft.workerName}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

    document.querySelectorAll('#size-chips .chip').forEach(el=>el.addEventListener('click',()=>{draft.size=el.dataset.val;renderStep();}));
    document.querySelectorAll('#brand-chips .chip').forEach(el=>el.addEventListener('click',()=>{
      if(el.dataset.val==='__other__'){ if(QUICK_BRANDS.includes(draft.brand)) draft.brand=''; }
      else draft.brand=el.dataset.val;
      renderStep();
      if(el.dataset.val==='__other__'){ const inp=document.getElementById('in-brand-other'); if(inp){inp.style.display='block';inp.focus();} }
    }));
    document.querySelectorAll('#color-chips .chip').forEach(el=>el.addEventListener('click',()=>{
      const val=el.dataset.val;
      const idx=draft.colors.indexOf(val);
      if(idx>=0){
        draft.colors.splice(idx,1);
      }else{
        if(draft.colors.length>=2) draft.colors.shift();
        draft.colors.push(val);
      }
      renderStep();
      if(val==='__other__'){
        const inp=document.getElementById('in-color-other');
        if(inp){inp.style.display='block';inp.focus();}
      }
    }));
    document.getElementById('next1').addEventListener('click',()=>{
      const other=document.getElementById('in-brand-other');
      if(other && other.style.display!=='none' && other.value.trim()) draft.brand=other.value.trim();

      const colorOther=document.getElementById('in-color-other');
      if(colorOther) draft.customColor=colorOther.value.trim();

      const finalColors=(draft.colors||[]).map(v=>v==='__other__'?draft.customColor:v).filter(Boolean);
      draft.color=finalColors.join('／');

      if(!draft.gender||!draft.category||!draft.size||!draft.brand||!draft.color){
        showErr('err1','対象・種類・サイズ・ブランド・カラーを入力してください。');
        return;
      }
      step=1;renderStep();
    });
  }
  if(step===1){
    document.querySelectorAll('#feature-chips .chip').forEach(el=>el.addEventListener('click',()=>{toggleArr(draft.features,el.dataset.val);renderStep();}));
    document.querySelectorAll('#design-chips .chip').forEach(el=>el.addEventListener('click',()=>{toggleArr(draft.design,el.dataset.val);renderStep();}));
    document.getElementById('back2').addEventListener('click',()=>{step=0;renderStep();});
    document.getElementById('next2').addEventListener('click',()=>{step=2;renderStep();});
  }
  if(step===2){
    document.getElementById('back3').addEventListener('click',()=>{step=1;renderStep();});
    document.getElementById('next3').addEventListener('click',()=>{
      const vals={};let ok=true;MEASURE_FIELDS.forEach(f=>{const v=document.getElementById('m-'+f.key).value;vals[f.key]=v;if(!v||isNaN(v)||Number(v)<=0)ok=false;});
      if(!ok){showErr('err3','4項目すべてに寸法を入力してください。');return;} draft.measurements=vals;step=3;renderStep();
    });
  }
  if(step===3){
    document.querySelectorAll('#material-chips .chip').forEach(el=>el.addEventListener('click',()=>{
      draft.materialChoice = el.dataset.val;
      renderStep();
      if(el.dataset.val==='__other__'){
        const inp=document.getElementById('in-material-other');
        if(inp){inp.style.display='block';inp.focus();}
      }
    }));

    document.querySelectorAll('#condition-chips .chip').forEach(el=>el.addEventListener('click',()=>{
      draft.conditionChoice = el.dataset.val;
      renderStep();
    }));

    document.getElementById('back4').addEventListener('click',()=>{step=2;renderStep();});

    document.getElementById('next4').addEventListener('click',()=>{
      const otherMat=document.getElementById('in-material-other');
      if(otherMat) draft.customMaterial=otherMat.value.trim();

      draft.material = draft.materialChoice==='__other__' ? draft.customMaterial : draft.materialChoice;
      draft.conditionDetail = document.getElementById('in-conddetail').value.trim();

      if(!draft.material){
        showErr('err4','素材を選択してください。その他の場合は素材名を入力してください。');
        return;
      }
      if(!draft.conditionChoice){
        showErr('err4','状態を選択してください。');
        return;
      }
      hideErr('err4');
      step=4;
      renderStep();
    });
  }
  if(step===4){
    document.getElementById('back5').addEventListener('click',()=>{step=3;renderStep();});
    document.getElementById('download-data').addEventListener('click',async()=>{
      downloadDraftCsv();
      if(!itemsLoaded) await loadItems();
      const no=items.length+1; const newItem={id:'item_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),no,displayNo:fmtNo(no),createdAt:new Date().toISOString(),status:'new',price:'',adminDescription:'',...JSON.parse(JSON.stringify(draft))};
      items.push(newItem);
      await saveItem(newItem);
      document.getElementById('download-done').style.display='flex'; document.getElementById('next-item').style.display='block';
    });
    document.getElementById('next-item').addEventListener('click',()=>{draft=blankDraft();gateUnlocked=false;step=0;renderGate();renderRecent();});
  }
}

function toggleArr(arr, val){
  const idx = arr.indexOf(val);
  if(idx===-1) arr.push(val); else arr.splice(idx,1);
}
function showErr(id,msg){
  const el=document.getElementById(id);
  el.textContent=msg; el.style.display='flex';
  el.scrollIntoView({behavior:'smooth', block:'center'});
}
function hideErr(id){ const el=document.getElementById(id); if(el){el.style.display='none';} }

function showToast(msg){
  const el = document.getElementById('worker-toast');
  el.innerHTML = `<div class="save-toast"><i class="ti ti-check" aria-hidden="true"></i>${escapeHtml(msg)}</div>`;
  setTimeout(()=>{ el.innerHTML=''; }, 4000);
}

document.getElementById('filter-tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  adminFilter = btn.dataset.status;
  document.querySelectorAll('#filter-tabs button').forEach(b=>b.classList.toggle('active', b===btn));
  renderAdmin();
});
document.getElementById('search-box').addEventListener('input', e=>{ adminSearch = e.target.value.trim().toLowerCase(); renderAdmin(); });

async function renderAdmin(){
  const loading = document.getElementById('admin-loading');
  const retryBox = document.getElementById('admin-load-retry');
  const grid = document.getElementById('admin-grid');
  const empty = document.getElementById('admin-empty');
  retryBox.style.display = 'none';
  if(!itemsLoaded){
    loading.style.display='flex'; grid.innerHTML=''; empty.style.display='none';
    await loadItems();
    loading.style.display='none';
    if(!itemsLoaded){
      // loadItems failed (network/timeout) — offer manual retry instead of hanging forever
      retryBox.style.display = 'block';
      return;
    }
  }
  if(!templateLoaded) await loadTemplate();
  let list = items.slice().reverse().filter(it=>!it.deleted);
  if(adminFilter!=='all') list = list.filter(it=>it.status===adminFilter);
  if(adminSearch) list = list.filter(it=>
    (it.displayNo||'').toLowerCase().includes(adminSearch) ||
    (it.brand||'').toLowerCase().includes(adminSearch) ||
    (it.category||'').toLowerCase().includes(adminSearch)
  );
  if(!list.length){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML = list.map(it=>{
    const statusCls = STATUS_CLASS[it.status] || 'status-new';
    const statusLabel = STATUS_LABELS[it.status] || '未確認';
    const priceLabel = it.price ? ('¥'+Number(it.price).toLocaleString()) : '未設定';
    const title = it.titleOverride || buildTitle(it);
    return `
      <div class="tag-card ${statusCls}" data-id="${it.id}">
        <div class="tag-status-bar"></div>
        <div class="tag-hole"></div>
        <div class="tag-main">
          <div class="tno">${it.displayNo}</div>
          <div class="tname">${escapeHtml(title)}</div>
          <div class="tmeta">肩幅${it.measurements.shoulder}・身幅${it.measurements.chest}・着丈${it.measurements.length}・袖丈${it.measurements.sleeve} cm　状態${it.rank}</div>
        </div>
        <div style="text-align:right;">
          <div class="tag-price">${priceLabel}</div>
          <div class="tag-status-pill" style="margin-top:6px;">${statusLabel}</div>
        </div>
      </div>
    `;
  }).join('');
  grid.querySelectorAll('.tag-card').forEach(el=>el.addEventListener('click', ()=>openDetail(el.dataset.id)));
}

        <button class="btn btn-ghost" id="delete-cancel" style="flex:1;">キャンセル</button>
        <button class="btn btn-primary" id="delete-confirm" style="flex:1;background:var(--red-deep);">削除する</button>
      </div>
    `;
    document.getElementById('delete-cancel').addEventListener('click', ()=>renderDetail());
    document.getElementById('delete-confirm').addEventListener('click', async ()=>{
      const btn = document.getElementById('delete-confirm');
      btn.disabled = true; btn.textContent = '削除中…';
      it.deleted = true;

      }
    });
  });
}

  const designLine = (it.design||[]).join('、') || 'なし';

  const body =
`【${title}】

【ブランド】${it.brand}
【色】${it.color}
【スタイル】${it.category}
【特徴】${featureLine}
【デザイン】${designLine}

【サイズ】${it.size}サイズ

【実寸】
　肩幅　${it.measurements.shoulder}cm
　身幅　${it.measurements.chest}cm
　着丈　${it.measurements.length}cm
　袖丈　${it.measurements.sleeve}cm

【ランク】${it.rank}ランク

【状態詳細】
${it.conditionDetail}
${it.adminDescription ? '\n' + it.adminDescription : ''}

${rankLines}

【注意事項】
${template.cautionNote}

【発送方法】
${template.shippingMethod}(${template.shippingFeeNote})
発送元:${template.shippingArea}／${template.shippingDays}
3辺合計:${it.shippingSize||'-'}

【梱包について】
${template.packagingNote}

${template.promoNote}
${template.negotiationNote}`;

  let text = `■商品名\n${title}\n\n■価格\n${price}\n\n` + body;
  if(activePlatform==='rakuma'){
    text += `\n\n※フォロー割・おまとめ割ご相談ください。`;
  }
  document.getElementById('gen-text').value = text;
}

function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

(async function init(){
  bindAuthGate();
})();

function bindAuthGate(){
  const btn = document.getElementById('auth-btn');
  const input = document.getElementById('auth-input');
  const errBox = document.getElementById('auth-err');
  function showAuthErr(msg){ errBox.textContent = msg; errBox.style.display = 'block'; }
  function hideAuthErr(){ errBox.style.display = 'none'; }

  async function attemptLogin(){
    const code = input.value.trim();
    if(!code){ showAuthErr('正しいアクセスコードを入力してください。'); return; }
    btn.disabled = true; btn.textContent = '確認中…';
    currentAccessCode = code;
    const res = await callGAS('list');
    btn.disabled = false; btn.textContent = '開く';

    if(res && res.ok){
      hideAuthErr();
      items = Array.isArray(res.items) ? res.items : [];
      itemsLoaded = true;
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('app-root').style.display = 'block';
      await startApp();
    } else if(res && res.error === 'network'){
      showAuthErr('通信エラーが発生しました。ネットワーク環境をご確認ください。');
    } else {
      // covers explicit auth-failure responses and any other non-success case
      showAuthErr('正しいアクセスコードを入力してください。');
    }
  }

  btn.addEventListener('click', attemptLogin);
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') attemptLogin(); });
}

async function startApp(){
  renderGate();
  if(!itemsLoaded) await loadItems();
  await loadTemplate();
  renderRecent();
}
</script>
</body>
